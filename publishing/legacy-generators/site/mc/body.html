<div class="top">
    <div class="brand"><span class="tag">MATCH CENTRE</span><span class="comp" id="comp">Premier League</span></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="main">
    <div class="status-pill" id="pill"><span class="dot"></span><span id="pill-text">KICK-OFF</span><span class="added" id="added"></span></div>
    <div class="fixture">
      <div class="side home">
        <div class="crest"><img id="home-badge" alt=""></div>
        <div class="tname" id="home-name"></div>
        <div class="tbar"></div>
      </div>
      <div class="score pre" id="score">
        <span class="box" id="home-score">0</span><span class="dash" id="dash">V</span><span class="box" id="away-score">0</span>
      </div>
      <div class="side away">
        <div class="crest"><img id="away-badge" alt=""></div>
        <div class="tname" id="away-name"></div>
        <div class="tbar"></div>
      </div>
    </div>
    <div class="events">
      <div class="ev-col home" id="home-events"></div>
      <div class="ev-col away" id="away-events"></div>
    </div>
    <div class="venue" id="venue"></div>
  </div>

  <div class="right">
    <div class="card-box">
      <div class="card-head"><span>Today's Scores</span><small id="scores-sub"></small></div>
      <div id="scores"></div>
    </div>
    <div class="card-box">
      <div class="card-head"><span id="table-title">Table</span><small id="table-sub">P · GD · PTS</small></div>
      <div class="swap">
        <div id="table" class="view on"></div>
        <div id="facts" class="view"></div>
      </div>
    </div>
  </div>

  <div class="ticker">
    <div class="tk-label">TEAM NEWS</div>
    <div class="tk-window"><div class="tk-track" id="tk-track"></div></div>
  </div>
