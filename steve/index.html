*{box-sizing:border-box;margin:0;padding:0}

body{min-height:100vh;display:flex;flex-direction:column;font-family:Nunito,system-ui,sans-serif;color:#fff;
 background:radial-gradient(ellipse 70% 50% at 50% 40%,#2b2a8a,transparent 70%),linear-gradient(180deg,#0a0a3f,#1a1466 55%,#3a1a6e) fixed,#1a1466}

.confetti{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,16px);max-width:640px;margin:0 auto}

.units b{display:block;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(2rem,10vw,4.2rem);line-height:1;font-variant-numeric:tabular-nums}
.units span{display:block;margin-top:6px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(.62rem,2.6vw,.85rem);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.lines{margin-top:20px;font-size:clamp(1rem,3.8vw,1.15rem);line-height:1.55;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.lines b{font-weight:800}
.done{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(2rem,9vw,3.4rem);color:var(--gold);margin:10px 0}
@media (prefers-reduced-motion:no-preference){
  .cf{animation:fl 6s ease-in-out infinite alternate}.c1{animation-delay:-1.5s}.c2{animation-delay:-3s;animation-duration:7s}.c3{animation-delay:-4.5s;animation-duration:5s}
}
@keyframes fl{from{opacity:.85}to{opacity:.25}}

.testbar a{color:inherit}
footer{position:relative;z-index:2;text-align:center;font-size:.72rem;opacity:.7;padding:10px 16px 14px}

<main>
  <h1>Steve’s <span>60th</span> birthday</h1>
  <p class="label" id="label">Counting down</p>
  <div class="units" id="units" role="timer" aria-live="off">
    <div><b id="u-d">-</b><span id="l-d">Days</span></div>
    <div><b id="u-h">--</b><span>Hours</span></div>
    <div><b id="u-m">--</b><span>Minutes</span></div>
    <div><b id="u-s">--</b><span>Seconds</span></div>
  </div>
  <p class="lines" id="lines">to <b>Thursday 31 December 2026</b>.</p>
  <p class="done" id="done" hidden>Happy 60th birthday, Steve! 🎉</p>
</main>
<p class="testbar" id="testbar" hidden>Test mode: pretending it’s <b></b> · <a href="/steve/">Back to now</a></p>

<script>
(function(){
  var END=Date.parse('2026-12-31T00:00:00Z'),$=function(id){return document.getElementById(id)},pad=function(n){return (n<10?'0':'')+n};
  /* test mode: /steve/?t=2026-12-30T23:59:50 pretends it's that UK time (GMT) and the clock runs on from there */
  var SHIFT=0,tq=new URLSearchParams(location.search).get('t');
  if(tq){var tp=Date.parse(/[zZ]|[+-]\d\d:?\d\d$/.test(tq)?tq:tq+(tq.length<=10?'T00:00':'')+'Z');
    if(!isNaN(tp)){SHIFT=tp-Date.now();var tb=$('testbar');tb.hidden=false;
      tb.querySelector('b').textContent=new Date(tp).toLocaleString('en-GB',{timeZone:'Europe/London',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}}
  function tick(){var now=Date.now()+SHIFT;
    if(now>=END){$('label').hidden=true;$('units').hidden=true;$('lines').hidden=true;$('done').hidden=false;return;}
    var t=Math.floor((END-now)/1000);$('u-d').textContent=Math.floor(t/86400);$('u-h').textContent=pad(Math.floor(t%86400/3600));$('u-m').textContent=pad(Math.floor(t%3600/60));$('u-s').textContent=pad(t%60);
    $('l-d').textContent=Math.floor(t/86400)===1?'Day':'Days';setTimeout(tick,1000-(Date.now()%1000));}
  tick();
})();
</script>
