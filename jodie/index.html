<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hey Jodie</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07093f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@400;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f1c45c}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;font-family:Nunito,system-ui,sans-serif;color:#fff;
 background:linear-gradient(180deg,#07093f 0%,#141a7a 38%,#33219f 60%,#6b2fb0 78%,#b85cc8 92%,#e89ac4 100%) fixed,#141a7a}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.snow{position:fixed;inset:0;z-index:2;pointer-events:none;background-image:radial-gradient(circle,#fff 1.4px,transparent 1.8px),radial-gradient(circle,rgba(255,255,255,.75) 1px,transparent 1.4px),radial-gradient(circle,rgba(255,255,255,.55) 2px,transparent 2.6px);background-size:120px 120px,80px 80px,190px 190px;background-position:0 0,40px 30px,90px 60px}
.scene{position:fixed;left:0;right:0;bottom:0;width:100%;height:clamp(240px,46vh,540px);z-index:1;display:block;overflow:visible}
main{position:relative;z-index:3;flex:1;width:100%;max-width:820px;margin:0 auto;padding:clamp(28px,7vh,72px) 16px 20px;text-align:center}
h1{font-family:Cinzel,"Trajan Pro",Georgia,serif;font-weight:700;font-size:clamp(2.6rem,11vw,5rem);line-height:1.05;letter-spacing:.02em;margin:0 0 .3em;text-shadow:0 0 24px rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.25)}
h1 .holly{display:inline-block;font-size:.5em;vertical-align:.5em;margin-left:.15em}
.label{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(1rem,4vw,1.4rem);letter-spacing:.08em;margin-bottom:12px}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,16px);max-width:640px;margin:0 auto}
.units div{border:1px solid rgba(255,255,255,.35);border-radius:16px;background:rgba(14,12,80,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 24px rgba(5,4,40,.35);padding:clamp(10px,2.4vw,20px) 4px clamp(8px,2vw,16px);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);position:relative}
.units div::before{content:"";position:absolute;left:10%;right:10%;top:-5px;height:9px;border-radius:9px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.units b{display:block;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(2rem,10vw,4.2rem);line-height:1;font-variant-numeric:tabular-nums}
.units span{display:block;margin-top:6px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(.62rem,2.6vw,.85rem);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.lines{margin-top:18px;font-size:clamp(.95rem,3.6vw,1.12rem);line-height:1.55;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.lines b{font-weight:800}
.lines .tap{margin-top:8px;font-size:.85rem;opacity:.75}
.done{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(1.8rem,8vw,3rem);color:var(--gold);margin:8px 0}
.veh{cursor:pointer;outline:none}
.veh:focus-visible rect:first-of-type,.veh:focus-visible path:first-of-type{stroke:var(--gold);stroke-width:3}
.boat-move{transform:translate(300px,420px)}
.tram-move{transform:translate(700px,464px)}
.spin{transform-box:view-box}
@media (prefers-reduced-motion:no-preference){
  .snow{animation:snow 14s linear infinite}
  .spin{animation:spin 60s linear infinite}
  .car{animation:spin 60s linear infinite reverse;transform-box:fill-box;transform-origin:50% 0}
  .boat-move{animation:boat 90s linear infinite;animation-delay:-38s}
  .tram-move{animation:tram 36s linear infinite;animation-delay:-14s}
  .tw{animation:tw 2.6s ease-in-out infinite alternate}.t1{animation-delay:-.7s}.t2{animation-delay:-1.4s;animation-duration:3.4s}.t3{animation-delay:-2.1s;animation-duration:2s}
  .blink{animation:blink 2s steps(1) infinite}
  .glow{animation:glow 6s ease-in-out infinite alternate}
}
@keyframes snow{from{background-position:0 0,40px 30px,90px 60px}to{background-position:30px 600px,10px 430px,150px 760px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes boat{from{transform:translate(-500px,420px)}to{transform:translate(1700px,420px)}}
@keyframes tram{from{transform:translate(1700px,464px)}to{transform:translate(-700px,464px)}}
@keyframes tw{from{opacity:1}to{opacity:.3}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.2}}
@keyframes glow{from{fill:#7fd6ff}to{fill:#ff8fc0}}
.toast{position:fixed;z-index:5;left:50%;bottom:20px;transform:translateX(-50%);max-width:90%;background:#fff;color:#141a7a;border-radius:999px;padding:.55em 1.1em;font-weight:800;font-size:.95rem;box-shadow:0 8px 18px rgba(0,0,0,.3);text-align:center}
.toast:empty{display:none}
.testbar{position:fixed;z-index:6;top:0;left:0;right:0;text-align:center;background:#f1c45c;color:#1a1060;font-weight:800;font-size:.85rem;padding:6px 12px}
.testbar a{color:inherit}
footer{position:fixed;z-index:3;left:0;right:0;bottom:4px;text-align:center;font-size:.72rem;opacity:.7;pointer-events:none}
@media (max-width:600px){.scene{height:clamp(220px,44vh,420px)}}
</style>
</head>

  </div>

<script>
(function(){
  var END=Date.parse('2026-12-16T17:00:00Z');
  var $=function(id){return document.getElementById(id)};
  var pad=function(n){return (n<10?'0':'')+n};
  var sc=document.querySelector('.scene');function fit(){sc.setAttribute('preserveAspectRatio',sc.clientWidth/sc.clientHeight>2.4?'xMidYMax meet':'xMidYMax slice');}fit();addEventListener('resize',fit);
  function show(t){t=Math.max(0,Math.floor(t/1000));
    $('u-d').textContent=Math.floor(t/86400);$('u-h').textContent=pad(Math.floor(t%86400/3600));$('u-m').textContent=pad(Math.floor(t%3600/60));$('u-s').textContent=pad(t%60);
    $('l-d').textContent=Math.floor(t/86400)===1?'Day':'Days';}
  /* test mode: /jodie/?t=2026-12-16T16:59 pretends it's that UK time (GMT) and the clock runs on from there */
  var SHIFT=0,tq=new URLSearchParams(location.search).get('t');
  if(tq){var tp=Date.parse(/[zZ]|[+-]\d\d:?\d\d$/.test(tq)?tq:tq+(tq.length<=10?'T00:00':'')+'Z');
    if(!isNaN(tp)){SHIFT=tp-Date.now();var tb=$('testbar');tb.hidden=false;
      tb.querySelector('b').textContent=new Date(tp).toLocaleString('en-GB',{timeZone:'Europe/London',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}}
  function tick(){
    var now=Date.now()+SHIFT;
    if(now>=END){$('label').hidden=true;$('units').hidden=true;$('done').hidden=false;$('lines').innerHTML='';return;}
    show(END-now);setTimeout(tick,1000-(Date.now()%1000));}
  tick();
  var toast=$('toast'),tm;
  document.querySelectorAll('.veh').forEach(function(v){function say(){toast.textContent=v.getAttribute('data-msg');clearTimeout(tm);tm=setTimeout(function(){toast.textContent=''},3500);}
    v.addEventListener('click',say);v.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();say();}});});
})();
</script>
