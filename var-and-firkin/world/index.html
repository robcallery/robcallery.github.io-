    var rows=[],last='';
    list.forEach(function(g){var d=dayLong(g.date);
      if(d!==last){rows.push({html:'<div class="row dh">'+esc(d)+'</div>',n:1});last=d}
      rows.push({html:gameLine(g),n:1});
    });
    return rows;
  }
  function comp(c,quiet){
    $('pnum').textContent='P'+c.p;$('title').textContent=c.n;
    var nb=neighbours(c.p);setNav(nb[0]||302,nb[1]);
    var list=GAMES[c.p]||[], beer=c.beer?'<div class="row"> </div><div class="row m">PINT WITH THIS: <span class="w">'+esc(String(c.beer).toUpperCase())+'</span></div>':'';
    if(list.length){
      var pg=paginate(gameRows(list),15);
      $('screen').innerHTML='<div class="row c">'+dayLong(new Date())+'</div><div class="row"> </div>'+pg.join('')+beer;
      return;
    }
    $('sub').textContent='';
    if(!quiet)$('screen').innerHTML='<div class="row w">NO GAMES TODAY.</div><div class="row c">LOOKING UP THE NEXT FIXTURES<span class="blink">...</span></div>';
    loadNext(c).then(function(nx){
      if(cur!==c.p)return;
      $('screen').innerHTML='<div class="row w">NO GAMES TODAY.</div>'+(nx.length?'<div class="row c">NEXT FIXTURES</div>'+paginate(fixtureRows(nx),14).join(''):'<div class="row c">NO FIXTURES FOUND IN THE NEXT FOUR WEEKS.</div>')+beer;
    });
  }
  function render(quiet){
    if(!loaded)return;
    if(cur===302||!BY[cur])return index();
    comp(BY[cur],quiet);
  }
  function go(p){p=+p;if(p===303){location.href='/var-and-firkin/leeds/ceefax/';return}
    if(p!==302&&!BY[p]){$('typed').textContent='P'+p+' NOT FOUND';setTimeout(function(){$('typed').textContent=''},1500);return}
    if(String(p)!==location.hash.slice(1))location.hash=p;else{cur=p;sub=0;render()}}
  addEventListener('hashchange',function(){var p=+location.hash.slice(1)||302;cur=BY[p]?p:302;sub=0;render();scrollTo(0,0)});
  /* type a page number, like the real thing */
  var typed='';
  addEventListener('keydown',function(e){
    if(/^[0-9]$/.test(e.key)){typed+=e.key;$('typed').textContent='P'+typed+'___'.slice(typed.length);if(typed.length===3){var p=typed;typed='';setTimeout(function(){$('typed').textContent='';go(p)},250)}}
    else if(e.key==='ArrowRight'){var n=neighbours(cur===302?-1:cur)[1];if(n)go(n)}
    else if(e.key==='ArrowLeft'&&cur!==302){var q=neighbours(cur)[0];go(q||302)}
  });
  /* clock */
  function tick(){var d=new Date();$('date').textContent=d.toLocaleDateString('en-GB',{timeZone:'Europe/London',weekday:'short',day:'2-digit',month:'short'}).replace(/,/g,'');
    $('clock').textContent=d.toLocaleTimeString('en-GB',{timeZone:'Europe/London'})}
  tick();setInterval(tick,1000);
  cur=+location.hash.slice(1)||302;if(!BY[cur])cur=302;
  (function loop(){
    loadAll().then(function(){render(true);
      var live=Object.keys(GAMES).some(function(k){return (GAMES[k]||[]).some(function(g){return g.state==='in'})});
      setTimeout(loop,(live?45:300)*1000)},function(){setTimeout(loop,60000)});
  })();
})();
</script>
</body>
</html>
