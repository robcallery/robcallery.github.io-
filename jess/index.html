<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hey Jess</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0a5e">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@400;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f1c45c;--ink:#fff}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;font-family:Nunito,system-ui,sans-serif;color:#fff;
 background:linear-gradient(180deg,#0b0a5e 0%,#1d17a0 38%,#3b22b8 58%,#7a36c4 76%,#c26ad3 90%,#f0a2c8 100%) fixed,#1d17a0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scene{position:fixed;left:0;right:0;bottom:0;width:100%;height:clamp(240px,46vh,540px);z-index:1;display:block;overflow:visible}
.fw{position:fixed;z-index:1;width:120px;height:120px;opacity:0;pointer-events:none}
.fw svg{width:100%;height:100%}
.fw1{left:12%;top:44%}.fw2{right:14%;top:36%}.fw3{left:46%;top:28%;width:90px;height:90px}
main{position:relative;z-index:2;flex:1;width:100%;max-width:820px;margin:0 auto;padding:clamp(28px,7vh,72px) 16px 20px;text-align:center}
.eyebrow{font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-size:clamp(.72rem,2.6vw,.9rem)}
h1{font-family:Cinzel,"Trajan Pro",Georgia,serif;font-weight:700;font-size:clamp(2.6rem,11vw,5rem);line-height:1.05;letter-spacing:.02em;margin:.12em 0 .3em;text-shadow:0 0 24px rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.25)}
.label{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(1rem,4vw,1.4rem);letter-spacing:.08em;margin-bottom:12px}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,16px);max-width:640px;margin:0 auto}
.units div{border:1px solid rgba(255,255,255,.35);border-radius:16px;background:rgba(14,12,80,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 24px rgba(5,4,40,.35);padding:clamp(10px,2.4vw,20px) 4px clamp(8px,2vw,16px);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.units b{display:block;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(2rem,10vw,4.2rem);line-height:1;font-variant-numeric:tabular-nums}
.units span{display:block;margin-top:6px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(.62rem,2.6vw,.85rem);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.lines{margin-top:18px;font-size:clamp(.95rem,3.6vw,1.12rem);line-height:1.55;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.lines b{color:#fff;font-weight:800}
.lines .tap{margin-top:8px;font-size:.85rem;opacity:.75}
.done{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(1.8rem,8vw,3rem);color:var(--gold);margin:8px 0}
.veh{cursor:pointer;outline:none}
.veh:focus-visible rect:first-of-type,.veh:focus-visible path:first-of-type{stroke:var(--gold);stroke-width:3}
.neon{font-family:Nunito,sans-serif;font-weight:900;font-size:15px;fill:#ff6fa8}
.mono-move{transform:translate(860px,376px)}
.ferry-move{transform:translate(500px,418px)}
.bus-move{transform:translate(60px,446px)}
@media (prefers-reduced-motion:no-preference){
  .mono-move{animation:mono 38s linear infinite}
  .bus-move{animation:bus 50s linear infinite}
  .ferry-move{animation:ferry 80s linear infinite}
  .tw{animation:tw 3.2s ease-in-out infinite alternate}.t1{animation-delay:-.8s}.t2{animation-delay:-1.6s;animation-duration:4s}.t3{animation-delay:-2.4s;animation-duration:2.4s}
  .fw{animation:fw 6s ease-out infinite}.fw2{animation-delay:2s}.fw3{animation-delay:4s}
  .neon{animation:neon 5s steps(1) infinite}
}
@keyframes mono{from{transform:translate(2000px,376px)}to{transform:translate(-1100px,376px)}}
@keyframes bus{from{transform:translate(-950px,446px)}to{transform:translate(2000px,446px)}}
@keyframes ferry{0%{transform:translate(-950px,418px) rotate(0)}25%{transform:translate(-200px,420px) rotate(1deg)}50%{transform:translate(530px,417px) rotate(-1deg)}75%{transform:translate(1260px,420px) rotate(1deg)}100%{transform:translate(2000px,418px) rotate(0)}}
@keyframes tw{from{opacity:1}to{opacity:.25}}
@keyframes fw{0%{opacity:0;transform:scale(.2)}6%{opacity:1}30%{opacity:.9;transform:scale(1)}48%{opacity:0;transform:scale(1.15)}100%{opacity:0}}
@keyframes neon{0%,88%,94%{opacity:1}90%,96%{opacity:.35}}
.toast{position:fixed;z-index:3;left:50%;bottom:20px;transform:translateX(-50%);max-width:90%;background:#fff;color:#1d17a0;border-radius:999px;padding:.55em 1.1em;font-weight:800;font-size:.95rem;box-shadow:0 8px 18px rgba(0,0,0,.3);text-align:center}
.toast:empty{display:none}
.testbar{position:fixed;z-index:4;top:0;left:0;right:0;text-align:center;background:#f1c45c;color:#1a1060;font-weight:800;font-size:.85rem;padding:6px 12px}
.testbar a{color:inherit}
footer{position:fixed;z-index:2;left:0;right:0;bottom:4px;text-align:center;font-size:.72rem;opacity:.7;pointer-events:none}
@media (max-width:600px){.scene{height:clamp(220px,44vh,420px)}.fw{width:80px;height:80px}.fw1{top:52%}.fw2{top:58%;right:8%}.fw3{top:62%}}
</style>
</head>

<main>
  <h1>Hey Jess</h1>
  <p class="label" id="label">Rob finishes in</p>
  <div class="units" id="units" role="timer" aria-live="off">
    <div><b id="u-d">-</b><span id="l-d">Days</span></div>
    <div><b id="u-h">--</b><span>Hours</span></div>
    <div><b id="u-m">--</b><span>Minutes</span></div>
    <div><b id="u-s">--</b><span>Seconds</span></div>
  </div>
  <p class="done" id="done" hidden>Rob’s back! 🎉</p>
  <div class="lines"><p id="lines">Rob finishes at <b>5pm on Friday 6 November</b>.<br>He’s back at <b>9am sharp on Monday 23 November</b>.</p>
  <p class="tap">Tap a ride as it goes by for a surprise.</p></div>
</main>
<p class="testbar" id="testbar" hidden>Test mode: pretending it’s <b></b> · <a href="/jess/">Back to now</a></p>
<p class="toast" id="toast" role="status" aria-live="polite"></p>
<footer>Made with love · callery.co.uk</footer>
<script>
(function(){
  var END=Date.parse('2026-11-06T17:00:00Z'),BACK=Date.parse('2026-11-23T09:00:00Z');
  var $=function(id){return document.getElementById(id)};
  var pad=function(n){return (n<10?'0':'')+n};
  var sc=document.querySelector('.scene');function fit(){sc.setAttribute('preserveAspectRatio',sc.clientWidth/sc.clientHeight>2.4?'xMidYMax meet':'xMidYMax slice');}fit();addEventListener('resize',fit);
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){var s=document.querySelector('.scene');if(s&&s.pauseAnimations)s.pauseAnimations();}
  function show(t){t=Math.max(0,Math.floor(t/1000));
    $('u-d').textContent=Math.floor(t/86400);$('u-h').textContent=pad(Math.floor(t%86400/3600));$('u-m').textContent=pad(Math.floor(t%3600/60));$('u-s').textContent=pad(t%60);
    $('l-d').textContent=Math.floor(t/86400)===1?'Day':'Days';}
  /* test mode: /jess/?t=2026-11-06T16:59 pretends it's that UK time (GMT) and the clock runs on from there */
  var SHIFT=0,tq=new URLSearchParams(location.search).get('t');
  if(tq){var tp=Date.parse(/[zZ]|[+-]\d\d:?\d\d$/.test(tq)?tq:tq+(tq.length<=10?'T00:00':'')+'Z');
    if(!isNaN(tp)){SHIFT=tp-Date.now();var tb=document.getElementById('testbar');tb.hidden=false;
      tb.querySelector('b').textContent=new Date(tp).toLocaleString('en-GB',{timeZone:'Europe/London',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}}
  var phase=-1;
  function tick(){
    var now=Date.now()+SHIFT,p=now<END?0:now<BACK?1:2;
    if(p!==phase){phase=p;
      if(p===0){$('label').textContent='Rob finishes in';
        $('lines').innerHTML='Rob finishes at <b>5pm on Friday 6 November</b>.<br>He’s back at <b>9am sharp on Monday 23 November</b>.';}
      else if(p===1){$('label').textContent='Rob’s back in';
        $('lines').innerHTML='Rob’s back at <b>9am sharp on Monday 23 November</b>.';}
      else{$('label').hidden=true;$('units').hidden=true;$('done').hidden=false;$('lines').innerHTML='';}}
    if(p===2)return;
    show((p===0?END:BACK)-now);
    setTimeout(tick,1000-(Date.now()%1000));}
  tick();
  var toast=$('toast'),tm;
  document.querySelectorAll('.veh').forEach(function(v){function say(){toast.textContent=v.getAttribute('data-msg');clearTimeout(tm);tm=setTimeout(function(){toast.textContent=''},3500);}
    v.addEventListener('click',say);v.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();say();}});});
})();
</script>
