<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome home, Adam</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07093f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@400;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f1c45c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;font-family:Nunito,system-ui,sans-serif;color:#fff;
 background:linear-gradient(180deg,#07093f 0%,#16137a 36%,#3a1f9c 58%,#7a2fa8 76%,#c4569a 90%,#f08a7a 100%) fixed,#16137a}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.halves{display:none}
.scene{position:fixed;left:0;right:0;bottom:0;width:100%;height:clamp(250px,48vh,560px);z-index:1;display:block;overflow:visible}
.tag text{font-family:Nunito,sans-serif;font-weight:900;font-size:13px;letter-spacing:.2em;fill:#fff}
.fw{position:fixed;z-index:1;width:130px;height:130px;opacity:0;pointer-events:none}
.fw svg{width:100%;height:100%}
.fw1{left:6%;top:34%}.fw2{right:8%;top:30%}.fw3{left:40%;top:44%;width:100px;height:100px}.fw4{right:30%;top:16%;width:90px;height:90px}.fw5{left:22%;top:12%;width:80px;height:80px}.fw6{right:2%;top:52%;width:110px;height:110px}
main{position:relative;z-index:2;flex:1;width:100%;max-width:860px;margin:0 auto;padding:clamp(30px,8vh,80px) 16px 20px;text-align:center}
.hello{font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-size:clamp(.72rem,2.6vw,.9rem)}
h1{font-family:Cinzel,"Trajan Pro",Georgia,serif;font-weight:700;font-size:clamp(2.6rem,11vw,5.4rem);line-height:1.02;letter-spacing:.02em;margin:.15em 0 .25em;text-shadow:0 0 28px rgba(255,255,255,.4),0 2px 0 rgba(0,0,0,.25)}
h1 span{display:block;color:var(--gold)}
.lines{font-size:clamp(1rem,3.8vw,1.2rem);line-height:1.55;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.lines b{font-weight:800}
.lines .tap{margin-top:10px;font-size:.85rem;opacity:.75}
.veh{cursor:pointer;outline:none}
.veh:focus-visible>*:first-child{stroke:var(--gold);stroke-width:3}
.b1-move{transform:translate(120px,446px)}.b2-move{transform:translate(380px,446px)}
@media (prefers-reduced-motion:no-preference){
  .b1-move{animation:b1 22s linear infinite;animation-delay:-6s}.b2-move{animation:b2 28s linear infinite;animation-delay:-18s}
  .tw{animation:tw 2.8s ease-in-out infinite alternate}.t1{animation-delay:-.7s}.t2{animation-delay:-1.4s;animation-duration:3.4s}.t3{animation-delay:-2.1s;animation-duration:2.2s}
  .fw{animation:fw 5s ease-out infinite}.fw2{animation-delay:1.1s}.fw3{animation-delay:2.2s}.fw4{animation-delay:3.1s}.fw5{animation-delay:3.9s}.fw6{animation-delay:.6s;animation-duration:6s}
}
@media (prefers-reduced-motion:reduce){.fw1,.fw2,.fw4{opacity:.9}}
@keyframes b1{from{transform:translate(-500px,446px)}to{transform:translate(1700px,446px)}}
@keyframes b2{from{transform:translate(1700px,446px) scaleX(-1)}to{transform:translate(-500px,446px) scaleX(-1)}}
@keyframes tw{from{opacity:1}to{opacity:.45}}
@keyframes fw{0%{opacity:0;transform:scale(.2)}6%{opacity:1}30%{opacity:.95;transform:scale(1)}48%{opacity:0;transform:scale(1.15)}100%{opacity:0}}
.toast{position:fixed;z-index:5;left:50%;bottom:20px;transform:translateX(-50%);max-width:90%;background:#fff;color:#16137a;border-radius:999px;padding:.55em 1.1em;font-weight:800;font-size:.95rem;box-shadow:0 8px 18px rgba(0,0,0,.3);text-align:center}
.toast:empty{display:none}
footer{position:fixed;z-index:3;left:0;right:0;bottom:4px;text-align:center;font-size:.72rem;opacity:.7;pointer-events:none}
@media (max-aspect-ratio:4/5){.full{display:none}.halves{display:block;position:fixed;left:0;right:0;bottom:0;z-index:1}.half{display:block;width:100%;height:auto;overflow:hidden}.half+.half{margin-top:-2px}}
@media (max-width:600px){.scene{height:clamp(230px,44vh,420px)}.fw{width:90px;height:90px}.fw1{top:44%}.fw2{top:40%}.fw6{display:none}}
</style>
</head>
