<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callery — One Beer at a Time</title>
<meta name="description" content="Rob Callery: travelling the world one beer at a time, always heading home to Elland Road.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --skyTop:#06102a; --skyMid:#14306b; --skyBot:#2a4f9c; --pave:#1a2238; --night:1;
    --navy:#0a1838; --navy2:#13285a; --blue:#1d4ed8; --yellow:#ffcd00;
    --amber:#e8a317; --white:#f7f7f2; --muted:#b8c3dc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--white);font-family:Inter,system-ui,sans-serif;line-height:1.6}
  a{color:inherit}
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(var(--skyTop),var(--skyMid) 60%,var(--skyBot))}
  @media (min-aspect-ratio:1200/620){.hero{background:linear-gradient(to top,var(--pave) 15.5%,transparent 15.5%),linear-gradient(var(--skyTop),var(--skyMid) 60%,var(--skyBot) 84.5%)}}
  .hero svg{position:absolute;inset:0;width:100%;height:100%}
  .hero-text{position:relative;z-index:2;padding:5vh 16px 0;max-width:1240px;margin:0 auto;width:100%;text-align:center}
  .kicker{color:var(--yellow);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem}
  h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(2.8rem,7.5vw,5.2rem);line-height:.9;margin:.3em 0 .25em;text-shadow:0 4px 30px rgba(0,0,0,.4)}
  h1 span{color:var(--yellow)}
  h1,.lede{text-shadow:0 2px 14px rgba(6,16,42,.55)}
  #stars{opacity:var(--night)}
  .nightonly{opacity:calc(.25 + .75*var(--night))}
  .hero{transition:background 2s}
  #headline{white-space:nowrap;color:var(--white)}
  .lede{max-width:none;color:var(--ledeCol,#b8c3dc);font-size:clamp(1rem,2.2vw,1.2rem)}
  .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:1.5rem;justify-content:center}
  .btn{display:inline-block;padding:.8em 1.4em;border-radius:999px;font-weight:600;text-decoration:none;transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{background:var(--yellow);color:var(--navy)}
  .btn.ghost{border:2px solid var(--white)}
  section{max-width:1100px;margin:0 auto;padding:80px 16px}
  h2{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(2.2rem,5vw,3.5rem);line-height:1;margin-bottom:.6em}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
  .card{background:var(--navy2);border-top:4px solid var(--yellow);border-radius:14px;padding:24px}
  .card:nth-child(2){border-color:var(--blue)}
  .card:nth-child(3){border-color:var(--white)}
  .card h3{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:1.8rem;letter-spacing:.03em}
  .card p{color:var(--muted)}
  footer{border-top:1px solid #23396b;text-align:center;padding:32px 16px;color:var(--muted);font-size:.9rem}
  .bob{animation:bob 4s ease-in-out infinite;transform-origin:center}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .twinkle{animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.25}}
  .dash{stroke-dasharray:6 10;animation:fly 30s linear infinite}
  @keyframes fly{to{stroke-dashoffset:-800}}
  .plane{animation:fly1 26s linear infinite both}
  .p1{animation-delay:3s}
  .p2{animation-name:fly2;animation-duration:41s;animation-delay:14s}
  @keyframes fly1{0%{transform:translate(1300px,0)}22%{transform:translate(-200px,-30px)}100%{transform:translate(-200px,-30px)}}
  @keyframes fly2{0%{transform:translate(-120px,0)}18%{transform:translate(1350px,20px)}100%{transform:translate(1350px,20px)}}
  .walker{opacity:0}
  .step{animation:step .45s ease-in-out infinite alternate}
  @keyframes step{to{transform:translateY(-1.5px)}}
  @keyframes w0{0%{transform:translate(287px,760px) scale(1);opacity:0}8%{opacity:1}80%{transform:translate(137px,724px) scale(0.85);opacity:1}88%,100%{transform:translate(137px,724px) scale(0.85);opacity:0}}.w0{animation:w0 11s linear 0s infinite both}
  @keyframes w1{0%{transform:translate(247px,772px) scale(1);opacity:0}8%{opacity:1}80%{transform:translate(137px,724px) scale(0.85);opacity:1}88%,100%{transform:translate(137px,724px) scale(0.85);opacity:0}}.w1{animation:w1 13s linear 5s infinite both}
  @keyframes w2{0%{transform:translate(137px,724px) scale(0.85);opacity:0}10%{transform:translate(137px,724px) scale(0.85);opacity:1}88%{transform:translate(307px,750px) scale(1);opacity:1}96%,100%{transform:translate(307px,750px) scale(1);opacity:0}}.w2{animation:w2 12s linear 3s infinite both}
  @keyframes w3{0%{transform:translate(897px,762px) scale(1);opacity:0}8%{opacity:1}80%{transform:translate(1047px,724px) scale(0.85);opacity:1}88%,100%{transform:translate(1047px,724px) scale(0.85);opacity:0}}.w3{animation:w3 12s linear 1.5s infinite both}
  @keyframes w4{0%{transform:translate(927px,774px) scale(1);opacity:0}8%{opacity:1}80%{transform:translate(1047px,724px) scale(0.85);opacity:1}88%,100%{transform:translate(1047px,724px) scale(0.85);opacity:0}}.w4{animation:w4 14s linear 7s infinite both}
  @keyframes w5{0%{transform:translate(1047px,724px) scale(0.85);opacity:0}10%{transform:translate(1047px,724px) scale(0.85);opacity:1}88%{transform:translate(877px,752px) scale(1);opacity:1}96%,100%{transform:translate(877px,752px) scale(1);opacity:0}}.w5{animation:w5 11s linear 4s infinite both}
  .blink{animation:tw 1s steps(2) infinite}
  @media (max-width:900px){.hero{min-height:auto}.hero svg{position:relative;order:2;height:auto;margin-top:24px}.hero-text{padding-top:48px}}
  @media (prefers-reduced-motion:reduce){.bob,.twinkle,.dash,.blink{animation:none}.plane,.walker{display:none}}
</style>
</head>

    sunEl.setAttribute('transform','translate('+x.toFixed(0)+' '+Math.max(200,y).toFixed(0)+')');
    sunEl.style.opacity=a>-3?1:0;
    moon.style.opacity=night;
  }
  update(); setInterval(update,60000);
})();
</script>
<script>
(function(){
  var h=document.getElementById('headline');
  function fit(){
    h.style.fontSize='';
    var max=parseFloat(getComputedStyle(h).fontSize), avail=h.parentElement.clientWidth-32;
    if(h.scrollWidth>avail) h.style.fontSize=Math.floor(max*avail/h.scrollWidth)+'px';
  }
  fit(); addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
<script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</body>
