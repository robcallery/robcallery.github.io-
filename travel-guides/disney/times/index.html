:root{--navy:#0a1838;--gold:#f1c45c;--yellow:#ffcd00}

html,body{height:100%;overflow:hidden;background:#a6cf86}
body{font-family:Inter,system-ui,sans-serif;color:#fff}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{position:fixed;inset:0}
.map{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.lay-p{display:none}
@media (max-aspect-ratio:4/5){.lay-l{display:none}.lay-p{display:block}}
.hud{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(rgba(10,24,56,.92),rgba(10,24,56,.75));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Bebas Neue",Impact,sans-serif;font-size:1.4rem;letter-spacing:.06em;white-space:nowrap}
.brand svg{width:32px;height:32px}
.back{font-size:.85rem;font-weight:700;text-decoration:none;padding:.5em .9em;border:1.5px solid rgba(255,255,255,.45);border-radius:999px;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}
.title{position:fixed;z-index:2;top:calc(66px + env(safe-area-inset-top));left:16px;max-width:380px;background:rgba(10,24,56,.9);border:2px solid var(--gold);border-radius:16px;padding:14px 16px 12px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.trial{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.25em .6em;border-radius:4px}
h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.05;margin:.25em 0 .2em}
h1 em{color:var(--yellow)}
.clock{font-size:.9rem;color:#c9d0f0}.clock b{color:#fff}
@media (max-aspect-ratio:4/5){.title{left:0;right:0;max-width:none;top:calc(56px + env(safe-area-inset-top));border-radius:0;border-width:0 0 2px;padding:6px 14px 7px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.25)}.title .trial{font-size:.6rem;vertical-align:3px;margin-right:6px}h1{display:inline;font-size:clamp(1.15rem,5.2vw,1.6rem)}.clock{font-size:.78rem;margin-top:2px}.tap{display:none}}
.foot{position:fixed;z-index:2;left:0;right:0;bottom:0;padding:7px 150px calc(7px + env(safe-area-inset-bottom)) 14px;font-size:.74rem;color:#e8ecff;background:rgba(10,24,56,.85)}
.foot a{font-weight:800;color:#fff}
@media (max-width:700px){.foot{padding-right:130px;font-size:.7rem}.foot .more{display:none}}
.map .pn{font-family:"DM Serif Display",Georgia,serif;font-size:25px;fill:#0a1838}
.map .bt{font-family:Inter,sans-serif;font-weight:800;font-size:18px;fill:#fff}
.map .bs{font-family:Inter,sans-serif;font-weight:700;font-size:8.5px;letter-spacing:.06em;fill:#f1c45c;text-transform:uppercase}
.map .ms{font-family:Inter,sans-serif;font-weight:700;font-size:12.5px;fill:#4a5570}
.lab text{font-family:"DM Serif Display",Georgia,serif;font-style:italic;font-size:22px;fill:#2a6f95;opacity:.85}
.cmp{font-family:"DM Serif Display",Georgia,serif;font-size:20px;fill:#0a1838}
.pk{cursor:pointer;outline:none}
.pk:hover rect,.pk:focus-visible rect{stroke:#c0182f;stroke-width:4}
.pk:hover ellipse,.pk:focus-visible ellipse{stroke:#f1c45c;stroke-width:6}
@media (prefers-reduced-motion:reduce){.mv{display:none}}
@media (max-width:420px){.brand{font-size:1.2rem}.brand svg{width:28px;height:28px}.back{font-size:.78rem;min-height:36px}.hud{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px}}
</style>

<script>
(function(){
  var ids=[6, 5, 7, 8],$=function(id){return document.getElementById(id)};
  function set(id,v){['l','p'].forEach(function(k){var e=$(id+k);if(e)e.textContent=v;});}
  function clock(){$('clock').textContent=new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'});}
  function one(id){
    fetch('/api/waits/'+id,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
      var rides=[];(j.lands||[]).forEach(function(L){L.rides.forEach(function(r){rides.push(r)})});
      var open=rides.filter(function(r){return r.open});
      var avg=open.length?Math.round(open.reduce(function(s,r){return s+r.wait},0)/open.length):0;
      var top=open.slice().sort(function(a,b){return b.wait-a.wait})[0];
      set('b'+id,open.length?avg+'m':'Shut');set('bs'+id,open.length?'avg wait':'for now');
      set('o'+id,open.length?open.length+' of '+rides.length+' open'+(top?' · top '+top.wait+'m':''):'Closed right now');
    }).catch(function(){set('b'+id,'–');set('bs'+id,'no data');set('o'+id,'Tap for details');});}
  function all(){ids.forEach(one);}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.map').forEach(function(m){if(m.pauseAnimations)m.pauseAnimations();});}
